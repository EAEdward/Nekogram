# ====================================================================
#  eaedward — mihomo 配置（自建三节点版 / 已剔除 free）
#  34 组 → 25 组，39 rule-provider → 38，48 条规则 → 50，覆盖度不变
#  不设 authentication / secret：走内核默认（本机/单网段部署）
# ====================================================================

mixed-port: 7890
bind-address: 127.0.0.1
allow-lan: false
mode: rule
ipv6: true
log-level: warning
tcp-concurrent: true
unified-delay: true
find-process-mode: "off"
external-controller: "127.0.0.1:9090"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false      # 不改写目标，避免与 IP 规则打架
  sniff:
    HTTP:
      ports: [80, "8080-8880"]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:                    # Netflix 大量走裸 IP，强制嗅探域名
    - "+.netflix.com"
    - "+.nflxvideo.net"
  skip-domain:
    - "+.push.apple.com"
    - "+.apple.com"
    - "Mijia Cloud"
    - "dlg.io.mi.com"

hosts:
  "dns.alidns.com": ["223.5.5.5", "223.6.6.6"]
  "doh.pub": ["1.12.12.12", "120.53.53.53"]
  "dns.cloudflare.com": ["1.1.1.1", "1.0.0.1"]
  "dns.google": ["8.8.8.8", "8.8.4.4"]
  "services.googleapis.cn": ["services.googleapis.com"]
  "+.mcdn.bilivideo.com": ["0.0.0.0"]
  "+.mcdn.bilivideo.cn": ["0.0.0.0"]
  "+.edge.mountaintoys.cn": ["0.0.0.0"]

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: f2b0::/18
  fake-ip-filter:
    - "rule-set:private"
    - "rule-set:fakeip_filter"
    - "rule-set:cn"                 # 国内域名给真实 IP（需配合 sniffer）
    - "localhost.ptlogin2.qq.com"   # QQ 快速登录依赖 127.0.0.1
    - "+.eaedward.dpdns.org"
    - "+.269058.xyz"
    - "+.lly2004.asia"
    - "+.eaedward.edu.kg"
  default-nameserver: ["https://223.5.5.5/dns-query", "https://1.12.12.12/dns-query"]
  proxy-server-nameserver: ["https://223.5.5.5/dns-query#DIRECT", "https://1.12.12.12/dns-query#DIRECT"]
  nameserver: ["https://1.1.1.1/dns-query#代理", "https://8.8.8.8/dns-query#代理"]
  direct-nameserver: ["https://223.5.5.5/dns-query#DIRECT", "https://1.12.12.12/dns-query#DIRECT"]
  prefer-h3: false
  nameserver-policy:
    "rule-set:cn": ["https://223.5.5.5/dns-query#DIRECT", "https://1.12.12.12/dns-query#DIRECT"]

tun:
  enable: false
  stack: system
  device: Mihomo
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  dns-hijack:
    - "any:53"

proxy-providers:
  gcp:
    type: http
    url: "https://gcp.eaedward.dpdns.org/sub.yaml"
    path: ./providers/gcp.yaml
    interval: 3600
    proxy: DIRECT          # 订阅走直连下载，避免"代理要订阅、订阅要代理"死锁
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|重置"
    override:
      udp: true            # 订阅里没写 udp 的节点也强制开 UDP
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
      lazy: false
      timeout: 5000
  dedione:
    type: http
    url: "https://dedione.eaedward.dpdns.org/sub.yaml"
    path: ./providers/dedione.yaml
    interval: 3600
    proxy: DIRECT          # 订阅走直连下载，避免"代理要订阅、订阅要代理"死锁
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|重置"
    override:
      udp: true            # 订阅里没写 udp 的节点也强制开 UDP
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
      lazy: false
      timeout: 5000
  sg1:
    type: http
    url: "https://sg1.eaedward.dpdns.org/sub.yaml"
    path: ./providers/sg1.yaml
    interval: 3600
    proxy: DIRECT          # 订阅走直连下载，避免"代理要订阅、订阅要代理"死锁
    exclude-filter: "(?i)剩余|到期|过期|官网|流量|套餐|重置"
    override:
      udp: true            # 订阅里没写 udp 的节点也强制开 UDP
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
      lazy: false
      timeout: 5000

proxy-groups:
  # 约定：所有组一律 use 全部 provider，靠 filter 收窄国家；
  #       加减机房只动 provider 列表和 filter，不动已有组的 use
  # ---------- 美国：三种模式 + 筛出来的节点 ----------
  - name: '🇺🇸 美国-自动'
    type: url-test
    use: [dedione, gcp, sg1]
    filter: "^US-"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
    hidden: true
    empty-fallback: DIRECT
  - name: '🇺🇸 美国-故障转移'
    type: fallback
    use: [dedione, gcp, sg1]
    filter: "^US-"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: false
    hidden: true
    empty-fallback: DIRECT
  - name: '🇺🇸 美国-负载均衡'
    type: load-balance
    use: [dedione, gcp, sg1]
    filter: "^US-"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    strategy: sticky-sessions
    lazy: false
    hidden: true
    empty-fallback: DIRECT
  - name: '🇺🇸 美国'
    type: select
    proxies: ['🇺🇸 美国-自动', '🇺🇸 美国-故障转移', '🇺🇸 美国-负载均衡']
    use: [dedione, gcp, sg1]
    filter: "^US-"
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png'

  # ---------- 新加坡：三种模式 + 筛出来的节点 ----------
  - name: '🇸🇬 新加坡-自动'
    type: url-test
    use: [dedione, gcp, sg1]
    filter: "^SG-"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
    hidden: true
    empty-fallback: DIRECT
  - name: '🇸🇬 新加坡-故障转移'
    type: fallback
    use: [dedione, gcp, sg1]
    filter: "^SG-"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    lazy: false
    hidden: true
    empty-fallback: DIRECT
  - name: '🇸🇬 新加坡-负载均衡'
    type: load-balance
    use: [dedione, gcp, sg1]
    filter: "^SG-"
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    strategy: sticky-sessions
    lazy: false
    hidden: true
    empty-fallback: DIRECT
  - name: '🇸🇬 新加坡'
    type: select
    proxies: ['🇸🇬 新加坡-自动', '🇸🇬 新加坡-故障转移', '🇸🇬 新加坡-负载均衡']
    use: [dedione, gcp, sg1]
    filter: "^SG-"
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png'

  # ---- 出口 ----
  - name: '代理'
    type: select
    proxies: ['🇺🇸 美国', '🇸🇬 新加坡']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png'

  # ---- 业务组 ----
  - name: 'AI'
    type: select
    proxies: ['代理', 'DIRECT', '🇺🇸 美国', '🇸🇬 新加坡']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png'
  - name: 'Media'
    type: select
    proxies: ['代理', 'DIRECT', '🇺🇸 美国', '🇸🇬 新加坡']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ForeignMedia.png'
  - name: 'FCM'
    type: select
    proxies: ['代理', 'DIRECT', '🇺🇸 美国', '🇸🇬 新加坡']
    icon: 'https://fastly.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/firebase.svg'
  - name: 'Google'
    type: select
    proxies: ['代理', 'DIRECT', '🇺🇸 美国', '🇸🇬 新加坡']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google.png'
  - name: 'Microsoft'
