  cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: DIRECT
    path: ./ruleset/cn_ip.mrs
    url: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
rules:
# 1) 私有网络 / 局域网：最先判，任何流量都不该被误杀
  - DOMAIN-SUFFIX,lan,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

# 2) 广告拦截
  - RULE-SET,adblockmihomolite,AdBlock

# 3) 国内直连（CDN / 游戏下载就近）
  - RULE-SET,games_cn,DIRECT
  - RULE-SET,epicgames,DIRECT
  - RULE-SET,nvidia_cn,DIRECT
  - RULE-SET,apple_cn,DIRECT
  - RULE-SET,microsoft_cn,DIRECT
  - DOMAIN,fsend.cn,DIRECT
  - DOMAIN,international-gfe.download.nvidia.com,DIRECT

# 4) 禁 QUIC：国内直连已判完，境外全部回落 TCP
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

# 5) Emby 专项：自建 Emby 常挂在自有域名下，必须排在域名规则之前
  - RULE-SET,emby,Emby
  - DOMAIN-SUFFIX,mb3admin.com,Emby
  - DOMAIN-KEYWORD,emby,Emby

# 6) 自有域名：用户自定义优先于所有分类规则
  - DOMAIN-SUFFIX,eaedward.dpdns.org,Domain
  - DOMAIN-SUFFIX,269058.xyz,Domain
  - DOMAIN-SUFFIX,lly2004.asia,Domain
  - DOMAIN-SUFFIX,eaedward.edu.kg,Domain

# 7) 业务分流（域名）：越具体的规则越靠前
  - RULE-SET,ai,AI
  - RULE-SET,youtube,Media
  - RULE-SET,instagram,Media
  - RULE-SET,netflix,Media
  - RULE-SET,hbo,Media
  - RULE-SET,twitch,Media
  - RULE-SET,disney,Media
  - RULE-SET,niconico,Media
  - RULE-SET,bbc,Media
  - RULE-SET,pornhub,Media
  - RULE-SET,googlefcm,FCM
  - RULE-SET,google,Google
  - RULE-SET,github,代理
  - RULE-SET,telegram,Telegram
  - RULE-SET,twitter,Twitter
  - RULE-SET,tiktok,TikTok
  - RULE-SET,steam,Steam
  - RULE-SET,spotify,Spotify
  - RULE-SET,pikpak,PikPak
  - RULE-SET,microsoft,Microsoft
  - RULE-SET,apple,Apple

# 8) 业务分流（IP）
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,twitter_ip,Twitter,no-resolve
  - RULE-SET,netflix_ip,Media,no-resolve

# 9) 兜底
  - RULE-SET,gfw,代理
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn_ip,DIRECT
  - MATCH,漏网之鱼