# EA Nekogram - minimal built-in proxy
# Only this app's MTProto traffic: local SOCKS5 -> dedione Reality (primary)
# / gcp Reality (fallback). No rule providers, no LAN listener, no TUN.

mixed-port: 7890
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:
  - name: "dedione"
    type: vless
    server: dedione.ssh.eaedward.com
    port: 443
    domain-strategy: ipv4_only
    uuid: f242786f-0cd1-4084-80ad-dcddc9c1bab2
    network: tcp
    tls: true
    udp: true
    xudp: true
    flow: xtls-rprx-vision
    servername: cdn.jsdelivr.net
    client-fingerprint: chrome
    reality-opts:
      public-key: B4nQVNKXoYXaN3A1av9PRWZT7zuG0Kp-hxFMRvpuG2o
      short-id: d528132b

  - name: "gcp"
    type: vless
    server: gcp.ssh.eaedward.com
    port: 443
    domain-strategy: ipv4_only
    uuid: a38f5124-7c9a-4d99-8265-f30f97aaea01
    network: tcp
    tls: true
    udp: true
    xudp: true
    flow: xtls-rprx-vision
    servername: cdn.jsdelivr.net
    client-fingerprint: chrome
    reality-opts:
      public-key: _LZBkJRhHyRi-74vHVFZZV6bfVTLK4dmcU7NymLR-2E
      short-id: 000be238

proxy-groups:
  - name: PROXY
    type: fallback
    proxies:
      - dedione
      - gcp
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    timeout: 3000

rules:
  - MATCH,PROXY
