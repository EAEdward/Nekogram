name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up NDK 27.3
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Fetch mihomo core (arm64)
        run: |
          set -euo pipefail
          mkdir -p TMessagesProj_App/src/main/jniLibs/arm64-v8a
          curl -fsSL -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz
          gzip -dc /tmp/mihomo.gz > TMessagesProj_App/src/main/jniLibs/arm64-v8a/libmihomo.so
          chmod +x TMessagesProj_App/src/main/jniLibs/arm64-v8a/libmihomo.so
          ls -lh TMessagesProj_App/src/main/jniLibs/arm64-v8a/

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          apiId=${{ secrets.API_ID }}
          apiHash=${{ secrets.API_HASH }}
          sentryDsn=
          helperBotId=0
          helperBotUsername=
          mapsApiKey=
          EOF
          grep -v apiHash local.properties

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build arm64 release
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease -x lint --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Collect APKs
        if: always()
        run: find TMessagesProj_App/build/outputs -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-mihomo-arm64
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            TMessagesProj_App/build/reports/**
            TMessagesProj/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
